# /etc/dhcp/dhcpd.conf

default-lease-time 600;
max-lease-time 7200;

option domain-name-servers 208.67.222.222, 208.67.220.220;

# CTs/VMs subnet

subnet 10.10.200.0 netmask 255.255.255.0 {
        range 10.10.200.50 10.10.200.99;
        option routers 10.10.200.1;
}

# CT

host CT100 {
        hardware ethernet AA:BB:CC:DD:EE:11;
        fixed-address 10.10.200.100;

}

# VMs

host Windows11 {

        hardware ethernet AA:BB:CC:DD:EE:22;
        fixed-address 10.10.200.211;
}

host Ubunt24 {
        hardware ethernet AA:BB:CC:DD:EE:33;
        fixed-address 10.10.200.224;
}

# SBCs subnet

subnet 10.10.10.0 netmask 255.255.255.0 {
        range 10.10.10.100 10.10.10.254;
        option routers 10.10.10.1;
}

# Boards

host RPi4B {
        hardware ethernet AA:BB:CC:DD:EE:44;
        fixed-address 10.10.10.10;
}

host JetsonNano {
        hardware ethernet AA:BB:CC:DD:EE:55;
        fixed-address 10.10.10.11;
}

host KV260 {
        hardware ethernet AA:BB:CC:DD:EE:66;
        fixed-address 10.10.10.12;
}

ddns-update-style none;
